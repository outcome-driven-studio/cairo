name: CI

on:
  push:
    branches: [main, staging, 'growth/**']
  pull_request:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Test
        run: npm test
      - name: Syntax check
        run: node --check server.js && node --check src/services/mcpService.js && node --check src/notifications/index.js
